{% extends "base.html" %}
{% block title %}Become a Donor{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 2rem auto; text-align: center;">
  <h1 style="color: var(--primary); margin-bottom: 0.75rem;">Become a Donor</h1>
  <p style="margin-bottom: 1.5rem;">Do you already have a BloodLink donor account?</p>
  <div style="display:flex; flex-direction:column; gap:0.75rem;">
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Yes, I Have an Account</a>
    <a href="{{ url_for('auth.register') }}" class="btn btn-outline">No, Create an Account</a>
  </div>
</div>
{% endblock %}
