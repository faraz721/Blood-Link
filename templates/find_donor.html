{% extends "base.html" %}
{% block title %}Find Donor{% endblock %}

{% block content %}
<h1 style="color: var(--primary); margin-bottom: 1rem;">Find a Donor</h1>

<form id="searchForm" class="card" style="margin-bottom: 1.25rem;">
  <div class="form-group">
    <label for="blood_group">Blood Group *</label>
    <select id="blood_group" name="blood_group" required>
      <option value="">Select Blood Group</option>
      {% for bg in blood_groups %}
        <option value="{{ bg }}">{{ bg }}</option>
      {% endfor %}
    </select>
    <p class="form-hint">Blood group is required to search.</p>
  </div>

  <div class="form-group">
    <label for="district">District</label>
    <select id="district" name="district">
      <option value="">All Districts</option>
      {% for d in districts %}
        <option value="{{ d }}">{{ d }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label for="village_id">Village / Area</label>
    <select id="village_id" name="village_id">
      <option value="">Select Village</option>
      {% for v in villages %}
        <option value="{{ v.id }}" data-district="{{ v.district }}">{{ v.village_name }} ({{ v.district }})</option>
      {% endfor %}
    </select>
  </div>

  <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.5rem;">
    <button type="submit" class="btn btn-primary">Search</button>
    <button type="button" class="btn btn-outline" data-mode="all_districts">Search All Districts</button>
    <button type="button" class="btn btn-outline" data-mode="all_available">Search All Available Donors</button>
    <button type="button" class="btn btn-outline" data-mode="this_district">Search This District</button>
    <button type="button" class="btn btn-outline" data-mode="this_village">Search This Village</button>
  </div>
</form>

<p id="resultCount" class="form-hint"></p>
<div id="searchResults" class="donor-grid"></div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
