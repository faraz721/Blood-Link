{% extends "base.html" %}
{% block title %}Donor Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 2rem auto;">
  <h1 style="color: var(--primary); margin-bottom: 1rem;">Donor Login</h1>
  <form method="post" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required placeholder="03XXXXXXXXX">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
  </form>
  <p style="margin-top:1rem; text-align:center;">
    New donor? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
